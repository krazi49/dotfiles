source = ./colors.conf

background {
    monitor =
    path = screenshot
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba(0, 0, 0, 0.7)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

# --- the card (solid) ---
shape {
    monitor =
    size = 1100, 900
    color = $surface_container
    rounding = 0
    border_size = 4
    border_color = $on_surface
    position = 0, 0
    halign = center
    valign = center
}

# --- padlock ---
label {
    monitor =
    text =  
    color = $on_surface
    font_size = 32
    font_family = "Font Awesome 6 Free Solid"
    position = 0, 390
    halign = center
    valign = center
}

# --- date ---
label {
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $on_surface
    font_size = 24
    font_family = Zalando Sans Medium
    position = 0, 325
    halign = center
    valign = center
}

# --- clock ---
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $on_surface
    font_size = 100
    font_family = Zalando Sans Expanded Black
    position = 0, 230
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 0
    shadow_color = $outline_variant
    shadow_boost = 1
}

# --- avatar ---
image {
    monitor =
    path = $HOME/Pictures/pfp.jpg
    size = 100
    rounding = 0
    border_size = 4
    border_color = $on_surface
    position = 0, -180
    halign = center
    valign = center
}

# --- username ---
label {
    monitor =
    text = $USER
    color = $on_surface
    font_size = 26
    font_family = Zalando Sans Black
    position = 0, -270
    halign = center
    valign = center
}

# --- password field ---
input-field {
    monitor =
    font_family = Zalando Sans
    font_size = 15
    rounding = 0
    size = 230, 40
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.15
    placeholder_text = Enter your password
    outer_color = $on_surface
    inner_color = $surface_container
    font_color = $on_surface
    fade_on_empty = false
    position = 0, -325
    halign = center
    valign = center
}


# --- battery ---
label {
    monitor =
    text = cmd[update:1000] ~/.config/waybar/scripts/adaptie-lock.py
    color = $on_surface
    font_size = 15
    font_family = Zalando Sans Black
    position = 0, -325
    halign = center
    valign = center
}

# --- watermark ---
label {
    monitor =
    text = 󰣇 OLLO
    color = $primary
    font_size = 12
    font_family = Monaspace Krypton
    position = 0, -395
    halign = center
    valign = center
}
