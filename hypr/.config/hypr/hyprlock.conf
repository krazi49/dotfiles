source = ./colors.conf

background {
    path = screenshot
    blur_passes = 4
    brightness = 0.8
}

# --- Padlock (Top Center) ---
label {
    monitor =
    text = 
    color = $primary
    font_size = 20
    font_family = Font Awesome 6 Free Solid 

    position = 0, -40
    halign = center
    valign = top
}

# --- F1 GRID CLOCK (Vertical Tightening) ---

# Hour Tens (Top Left)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H" | cut -c 1)"
    color = $primary
    font_size = 180
    font_family = neonSupersans Black
    position = -65, 180  # Dropped from 200
    halign = center
    valign = center
}

# Hour Ones (Top Right)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H" | cut -c 2)"
    color = $primary
    font_size = 180
    font_family = neonSupersans Black
    position = 65, 90    # Dropped from 110
    halign = center
    valign = center
}

# The "Dots" (Center) - Massive & Bold
label {
    monitor =
    text = ●
    color = $inverse_primary
    font_size = 70 # Even larger for that HyperOS impact
    position = 0, 75 # Tightened Y-spread
    halign = center
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgb(0, 0, 0)
    shadow_boost = 1.2
    valign = center
}
label {
    monitor =
    text = ●
    color = $inverse_primary 
    font_size = 70 
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgb(0, 0, 0)
    shadow_boost = 1.2
    position = 0, 5 # Tightened Y-spread
    halign = center
    valign = center
}

# Minute Tens (Bottom Left)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M" | cut -c 1)"
    color = $primary
    font_size = 180
    font_family = neonSupersans Black
    position = -65, -20 # Raised from -40
    halign = center
    valign = center
}

# Minute Ones (Bottom Right)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M" | cut -c 2)"
    color = $primary
    font_size = 180
    font_family = neonSupersans Black
    position = 65, -110 # Raised from -130
    halign = center
    valign = center
}

# --- Date (Normal Weight) ---
label {
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $primary
    font_size = 22
    font_family = neonFlexcondensed
    position = 0, 410 # Raised to follow the tighter clock
    halign = center
    valign = center
}

# --- Date (Normal Weight) ---
label {
    monitor =
    text = cmd[update:0] echo "󰣇 $HOSTNAME"
    color = $primary
    font_size = 14
    font_family = neonFlexcode 
    position = 0, 380 # Raised to follow the tighter clock
    halign = center
    valign = center
}

# --- Compact Profile & Input Stack ---
image {
    monitor =
    path = $HOME/Pictures/pfp.jpg
    size = 65
    rounding = 100
    border_size = 2
    border_color = $entry_border_color
    
    position = 0, 180
    halign = center
    valign = bottom
}

input-field {
    font_family = neonSupersans
    font_size = 11
    size = 220, 45
    outline_thickness = 2
    dots_size = 0.2
    placeholder_text = Unlocking as <b>$USER</b>
    dots_spacing = 0.15
    outer_color = $outline
    inner_color = rgba(0, 0, 0, 0.1)
    font_color = $primary
    position = 0, 100
    fade_on_empty = false
    halign = center
    valign = bottom
}

# --- Universal Battery (Bottom Center) ---
label {
    monitor =
    # This uses the universal find command we made earlier
    text = cmd[update:1000] ~/.config/waybar/scripts/adaptie-lock.py 
    color = $primary
    font_size = 12
    font_family = neonSupersans Black
    position = 0, 40
    halign = center
    valign = bottom
}

# ── Lumina signature watermark ─────────────────────────────
label {
    monitor =
    text = 󰣇 LUMINA
    color = $primary
    font_size = 11
    font_family = neonFlexcode
    position = -15, 22
    halign = right
    valign = bottom
}

# ── Bottom accent dots ─────────────────────────────────────
label {
    monitor =
    text = ◆
    color = $primary
    font_size = 6
    position = -40, 28
    halign = right
    valign = bottom
}

label {
    monitor =
    text = ◆
    color = $tertiary
    font_size = 6
    position = -28, 28
    halign = right
    valign = bottom
}

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}
