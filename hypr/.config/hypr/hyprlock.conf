source = ./colors.conf

background {
    path = screenshot
    blur_passes = 1
    brightness = 0.9
    noise = 0.01
    contrast = 1.1
}

# ── Lumina: brutalist, zero radius, hard shadows ───────────────
# Active accent: @on_surface (warm white)
# Inactive border: @outline_variant (lumina border grey ~#444444)
# Border width: 3px (lumina medium)
# Shadow: hard offset, no blur — color = @on_surface / @outline_variant

# --- Padlock (Top Center) ---
label {
    monitor =
    text = 
    color = $on_surface
    font_size = 24
    font_family = "Font Awesome 6 Free Solid"

    position = 0, -50
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 0
    shadow_color = $outline_variant
    shadow_boost = 1
}

# --- F1 GRID CLOCK — Vertical Stack, Brutalist ---

# Hour Tens (Top Left)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H" | cut -c 1)"
    color = $on_surface
    font_size = 180
    font_family = neonSupersans Black
    position = -80, 160
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 0
    shadow_color = $outline_variant
    shadow_boost = 1
}

# Hour Ones (Top Right)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H" | cut -c 2)"
    color = $on_surface
    font_size = 180
    font_family = neonSupersans Black
    position = 80, 80
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 0
    shadow_color = $outline_variant
    shadow_boost = 1
}

# The "Dots" (Center) — Massive, Bold, Hard Shadow
label {
    monitor =
    text = ●
    color = $primary
    font_size = 80
    position = 0, 60
    halign = center
    shadow_passes = 1
    shadow_size = 0
    shadow_color = $outline_variant
    shadow_boost = 1
    valign = center
}
label {
    monitor =
    text = ●
    color = $primary
    font_size = 80
    shadow_passes = 1
    shadow_size = 0
    shadow_color = $outline_variant
    shadow_boost = 1
    position = 0, -10
    halign = center
    valign = center
}

# Minute Tens (Bottom Left)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M" | cut -c 1)"
    color = $on_surface
    font_size = 180
    font_family = neonSupersans Black
    position = -80, -40
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 0
    shadow_color = $outline_variant
    shadow_boost = 1
}

# Minute Ones (Bottom Right)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M" | cut -c 2)"
    color = $on_surface
    font_size = 180
    font_family = neonSupersans Black
    position = 80, -120
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 0
    shadow_color = $outline_variant
    shadow_boost = 1
}

# --- Date ---
label {
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $on_surface
    font_size = 24
    font_family = neonFlexcondensed
    position = 0, 380
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 0
    shadow_color = $outline_variant
    shadow_boost = 1
}

# --- Hostname ---
label {
    monitor =
    text = cmd[update:0] echo "󰣇 $HOSTNAME"
    color = $on_surface_variant
    font_size = 14
    font_family = neonFlexcode
    position = 0, 350
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 0
    shadow_color = $outline_variant
    shadow_boost = 1
}

# --- Compact Profile & Input Stack — Brutalist Input ---
image {
    monitor =
    path = $HOME/Pictures/pfp.jpg
    size = 72
    rounding = 0
    border_size = 3
    border_color = $on_surface

    position = 0, 160
    halign = center
    valign = bottom
}

input-field {
    font_family = neonSupersans
    font_size = 13
    size = 260, 56
    outline_thickness = 3
    dots_size = 0
    placeholder_text = Unlocking as <b>$USER</b>
    dots_spacing = 0.15
    outer_color = $on_surface
    inner_color = $surface_container
    font_color = $on_surface
    position = 0, 70
    fade_on_empty = false
    halign = center
    valign = bottom
}

# --- Universal Battery (Bottom Center) ---
label {
    monitor =
    text = cmd[update:1000] ~/.config/waybar/scripts/adaptie-lock.py
    color = $on_surface
    font_size = 13
    font_family = neonSupersans Black
    position = 0, 30
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 0
    shadow_color = $outline_variant
    shadow_boost = 1
}

# ── Lumina signature watermark ─────────────────────────────
label {
    monitor =
    text = 󰣇 LUMINA
    color = $primary
    font_size = 11
    font_family = neonFlexcode
    position = -20, 20
    halign = right
    valign = bottom
    shadow_passes = 1
    shadow_size = 0
    shadow_color = $outline_variant
    shadow_boost = 1
}

# ── Bottom accent dots (Lumina accent) ─────────────────────
label {
    monitor =
    text = ◆
    color = $primary
    font_size = 7
    position = -45, 25
    halign = right
    valign = bottom
}

label {
    monitor =
    text = ◆
    color = $primary
    font_size = 7
    position = -30, 25
    halign = right
    valign = bottom
}

label {
    monitor =
    text = ◆
    color = $primary
    font_size = 7
    position = -15, 25
    halign = right
    valign = bottom
}