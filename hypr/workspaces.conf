-- Workspace layout rules.
-- 1-10: regular workspaces, 11-12: bound to - and = keys.
-- special:magic is the scratchpad (SUPER+S toggles, SUPER+CTRL+S drops the active window in).

-- Per-monitor workspace assignment happens in monitors.lua; this file owns
-- window placement rules per workspace.

hl.workspace_rule({ workspace = "1", rule = { monitor = "eDP-1" } })

-- Scratchpad behaviour: magic workspace floats by default
hl.workspace_rule({ workspace = "special:magic", rule = { float = true } })
