"$schema" = 'https://starship.rs/config-schema.json'

format = "$character"

right_format = """\
$status\
$cmd_duration\
$python\
$nodejs\
$rust\
$git_metrics\
$git_status\
$git_branch\
$directory"""

# ── character ────────────────────────────────────────────────
[character]
success_symbol = '[󰁔](bold yellow)'
error_symbol   = '[󰁔](bold bright-cyan)'
vimcmd_symbol  = '[◀](bold yellow)'

# ── directory ────────────────────────────────────────────────
[directory]
truncation_length      = 2
truncation_symbol      = '󰌍/'
home_symbol            = '󰑂'
read_only              = ' 󰌾'
style                  = 'bold yellow'
read_only_style        = 'bold red'
before_repo_root_style = 'bright-black'
repo_root_style        = 'bold yellow'
format                 = '[$path]($style)[$read_only]($read_only_style)'
repo_root_format       = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)'

# ── command duration ─────────────────────────────────────────
[cmd_duration]
min_time          = 500
show_milliseconds = false
style             = 'bold blue'
format            = '[$duration]($style)  '

# ── status (only shows on failure) ───────────────────────────
[status]
disabled       = false
pipestatus     = false
symbol         = ' '
success_symbol = ''
style          = 'bold yellow'
format         = '[$symbol$status]($style)  '

# ── git ──────────────────────────────────────────────────────
[git_branch]
symbol = '󰘬 '
style  = 'bold blue'
format = '[$symbol$branch]($style)  '

[git_status]
style      = 'bold red'
format     = '([$all_status$ahead_behind]($style)  )'
ahead      = '⇡${count}'
behind     = '⇣${count}'
diverged   = '⇕⇡${ahead_count}⇣${behind_count}'
conflicted = '='
untracked  = '?${count}'
modified   = '!${count}'
staged     = '+${count}'
deleted    = '✘${count}'
stashed    = '󰆼'

[git_metrics]
disabled      = false
added_style   = 'green'
deleted_style = 'red'
format        = '([+$added]($added_style)[/](bright-black)[-$deleted]($deleted_style)  )'

# ── language / env modules (only show when relevant) ─────────
[python]
symbol = '󰌠 '
style  = 'yellow'
format = '[$symbol$version]($style)(\($virtualenv\)) '

[nodejs]
symbol = '󰎙 '
style  = 'green'
format = '[$symbol$version]($style)  '

[rust]
symbol = '󱘗 '
style  = 'red'
format = '[$symbol$version]($style)  '
